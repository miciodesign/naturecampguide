name: Foto Pixabay

on:
  push:
    paths:
      - 'foto-richieste.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scarica-foto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Scarica foto da Pixabay
        env:
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
        run: python3 _src/tools/pixabay_fetch.py

      - name: Commit foto candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _src/foto-candidati/
          git diff --staged --quiet || git commit -m "foto: aggiunge candidati Pixabay giro ${{ github.run_number }}"
          git push
